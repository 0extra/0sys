version: 1

server:
  hostname: proxy-01
  timezone: UTC

packages:
  install:
    - ufw
    - fail2ban

proxy:
  enabled: true
  runtime: docker
  port: 8443
  sni: www.microsoft.com
  max_connections: 512
  log_level: info
  version: "0.1.6"
  # commit_sha: "a1b2c3d4e5f6..."

firewall:
  default: deny
  allow: [22, 8443]