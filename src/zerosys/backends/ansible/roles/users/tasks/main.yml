---
- name: Install sudo on Debian
  ansible.builtin.package:
    name: sudo
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Install sudo on RedHat
  ansible.builtin.package:
    name: sudo
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Install sudo on Alpine
  community.general.apk:
    name: sudo
    state: present
  when: ansible_facts['os_family'] == "Alpine"

- name: Create user
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: "{{ user_groups }}"
    shell: "{{ user_shell }}"
    append: true
    create_home: true
    state: present

- name: Configure sudo access
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ user_name }}"
    content: "{{ user_name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: user_sudo | default(false) | bool

- name: Install SSH key
  ansible.posix.authorized_key:
    user: "{{ user_name }}"
    key: "{{ user_ssh_key }}"
    state: present
  when: (user_ssh_key | default('', true)) | length > 0