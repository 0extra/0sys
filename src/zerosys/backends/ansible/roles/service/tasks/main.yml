---
- name: Upload service config file
  ansible.builtin.copy:
    src: "{{ service_config_file }}"
    dest: "/etc/{{ service_name }}/{{ service_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  when: service_config_file is defined and service_config_file | length > 0
  notify: "restart {{ service_name }}"

- name: Ensure service state
  ansible.builtin.service:
    name: "{{ service_name }}"
    state: "{{ service_state }}"
    enabled: "{{ service_enabled }}"