---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"
  when:
    - server_hostname is defined
    - (server_hostname | default('', true)) | length > 0
    - ansible_facts['virtualization_type'] not in ["docker", "container", "lxc", "podman"]

- name: Set timezone
  community.general.timezone:
    name: "{{ server_timezone }}"
  when:
    - server_timezone is defined
    - (server_timezone | default('', true)) | length > 0
    - ansible_facts['os_family'] != "Alpine"

- name: Set locale
  ansible.builtin.locale_gen:
    name: "{{ server_locale }}"
    state: present
  when:
    - server_locale is defined
    - (server_locale | default('', true)) | length > 0
    - ansible_facts['os_family'] == "Debian"